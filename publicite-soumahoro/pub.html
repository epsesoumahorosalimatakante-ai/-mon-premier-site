<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Soumahoro Transport — Publicité réservation</title>
<style>
@font-face{font-family:M;src:url(assets/montserrat.woff2) format('woff2');font-weight:100 900;font-style:normal}
@font-face{font-family:M;src:url(assets/montserrat-italic.woff2) format('woff2');font-weight:100 900;font-style:italic}
:root{--or:#F7830F;--bl:#0B2B9A;--dk:#061A5E;--wh:#fff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#111}
body.render{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:M,sans-serif;color:#fff;background:#000;transform-origin:0 0}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.fill{position:absolute;inset:0}
svg{display:block}
.head{position:absolute;left:50px;right:50px;text-align:center;font-weight:900;font-style:italic;text-transform:uppercase;line-height:1;letter-spacing:-1px}
.head .ln{margin:0 0 16px}
.box{display:inline-block;padding:14px 30px 18px;background:var(--or);color:#fff;transform-origin:0 50%;box-shadow:0 14px 0 rgba(0,0,0,.18);border-radius:6px}
.box.bl{background:var(--bl)} .box.wh{background:#fff;color:var(--bl)} .box.dk{background:var(--dk)}
.box.none{background:none;box-shadow:none;text-shadow:0 6px 24px rgba(0,0,0,.35)}
.w{display:inline-block}
.logo-card{position:absolute;background:#fff;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.logo-card img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.shine{position:absolute;top:-20%;bottom:-20%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg)}
#brand{position:absolute;left:44px;top:170px;display:flex;align-items:center;gap:18px;z-index:50}
#brand .logo-card{position:relative;width:118px;height:118px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#brand .pill{background:var(--or);color:#fff;font-weight:900;font-style:italic;font-size:34px;padding:12px 26px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);text-transform:uppercase;border:4px solid #fff}
#wipe{position:absolute;inset:0;z-index:80;pointer-events:none}
#wipe div{position:absolute;top:-300px;height:2520px;width:1800px;transform:skewX(-14deg)}
#flash{position:absolute;inset:0;background:#fff;z-index:81;opacity:0}
/* phone UI */
.phone{position:absolute;background:#0d0f17;border-radius:86px;padding:22px;box-shadow:0 60px 120px rgba(0,0,0,.5), inset 0 0 0 4px #2a2f40}
.screen{position:relative;width:100%;height:100%;border-radius:66px;overflow:hidden;background:#F4F6FB;color:#0d1640}
.notch{position:absolute;top:18px;left:50%;width:170px;height:46px;margin-left:-85px;background:#0d0f17;border-radius:30px;z-index:5}
.sbar{position:absolute;top:24px;left:56px;right:56px;display:flex;justify-content:space-between;font-weight:800;font-size:30px;color:#fff;z-index:4}
.apphead{position:absolute;left:0;right:0;top:0;height:300px;background:linear-gradient(160deg,var(--bl),var(--dk));padding:110px 40px 0;display:flex;align-items:center;gap:24px}
.apphead .logo-card{position:relative;width:120px;height:120px;border-radius:26px;flex:none;box-shadow:none}
.apphead .nm{font-weight:900;font-style:italic;font-size:40px;line-height:1.05;color:#fff}
.apphead .nm span{color:var(--or)}
.form{position:absolute;left:30px;right:30px;top:330px}
.ftitle{font-weight:900;font-size:44px;margin:0 0 22px 8px}
.field{background:#fff;border-radius:28px;padding:20px 28px;margin-bottom:18px;box-shadow:0 8px 24px rgba(11,43,154,.08);display:flex;align-items:center;gap:22px}
.field .dot{width:26px;height:26px;border-radius:50%;flex:none}
.field .lab{font-size:24px;font-weight:600;color:#7a83a6}
.field .val{font-size:38px;font-weight:800;min-height:46px}
.field .cnt{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:44px;font-weight:900}
.field .cnt b{width:64px;height:64px;border-radius:50%;background:#EEF1FA;display:flex;align-items:center;justify-content:center;color:var(--bl)}
.field .cnt b.plus{background:var(--or);color:#fff}
.cta{position:absolute;left:30px;right:30px;bottom:60px;height:130px;border-radius:40px;background:linear-gradient(90deg,#FF9A2E,var(--or));color:#fff;font-weight:900;font-style:italic;font-size:38px;white-space:nowrap;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(247,131,15,.45)}
.touch{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.55);border:6px solid rgba(11,43,154,.55);z-index:20;opacity:0}
.ripple{position:absolute;border-radius:50%;border:8px solid #fff;z-index:19;opacity:0}
.confirm{position:absolute;inset:0;background:#fff;z-index:10;display:flex;flex-direction:column;align-items:center;padding-top:300px;text-align:center}
.confirm h3{font-weight:900;font-size:56px;font-style:italic;color:var(--bl);margin-top:40px;line-height:1.05}
.confirm p{font-size:32px;font-weight:600;color:#59628a;margin-top:18px}
.ticket{position:absolute;width:820px;height:400px;border-radius:36px;background:#fff;color:var(--bl);box-shadow:0 40px 90px rgba(0,0,0,.45);overflow:hidden;display:flex}
.ticket .l{width:260px;background:linear-gradient(170deg,var(--or),#E56A00);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
.ticket .l .logo-card{position:relative;width:150px;height:150px;border-radius:28px;box-shadow:none}
.ticket .l b{font-weight:900;font-style:italic;font-size:34px}
.ticket .r{flex:1;padding:34px 40px;position:relative;border-left:6px dashed #d9def0}
.ticket .r .k{font-size:22px;font-weight:600;color:#8a92b5;text-transform:uppercase;letter-spacing:2px}
.ticket .r .route{font-weight:900;font-style:italic;font-size:50px;display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.ticket .r .row{display:flex;gap:40px}
.ticket .r .row div b{display:block;font-size:34px;font-weight:800;color:#0d1640}
.ticket .stamp{position:absolute;right:30px;bottom:26px;background:#14A44D;color:#fff;font-weight:900;font-size:30px;padding:10px 22px;border-radius:14px;display:flex;align-items:center;gap:10px}
.notif{position:absolute;left:70px;width:940px;height:230px;border-radius:44px;background:rgba(255,255,255,.97);box-shadow:0 30px 70px rgba(0,0,0,.3);display:flex;align-items:center;gap:30px;padding:0 34px;color:#0d1640}
.notif .logo-card{position:relative;width:140px;height:140px;border-radius:30px;flex:none;box-shadow:0 0 0 3px #eef1fa}
.notif .a{font-size:26px;font-weight:600;color:#8a92b5}
.notif .b{font-size:42px;font-weight:900;margin:4px 0;display:flex;align-items:center;gap:12px}
.notif .c{font-size:30px;font-weight:600;color:#3b4570}
.chip{position:absolute;display:flex;align-items:center;gap:14px;background:#14A44D;color:#fff;font-weight:900;font-size:40px;padding:16px 30px;border-radius:999px;box-shadow:0 14px 40px rgba(0,0,0,.3);border:5px solid #fff}
.contact{position:absolute;left:90px;right:90px;border-radius:40px;background:#fff;color:var(--bl);padding:30px 40px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.contact .t{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:var(--or);text-align:center}
.contact .n{display:flex;align-items:center;justify-content:center;gap:22px;font-size:64px;font-weight:900;margin-top:8px;white-space:nowrap}
.contact .s{text-align:center;font-size:30px;font-weight:600;color:#59628a;margin-top:6px}
.sub{position:absolute;left:40px;right:40px;text-align:center;font-weight:800}
.word{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-style:italic;font-size:190px;letter-spacing:-4px;line-height:1}
.word span{display:inline-block;padding:10px 46px 24px;border-radius:12px;box-shadow:0 18px 0 rgba(0,0,0,.2)}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="brand"><div class="logo-card"><img src="assets/logo.jpg" alt=""></div><div class="pill">Réservez votre ticket</div></div>
  <div id="wipe"><div style="background:var(--bl)"></div><div style="background:var(--or)"></div></div>
  <div id="flash"></div>
</div>
<script>
/* ===== Coordonnées affichées à la fin : à remplacer par les vraies ===== */
const CONTACT = {
  titre: 'Réservations',
  tel: '+225 XX XX XX XX XX',
  info: 'Appel & WhatsApp'
};
const DUREE = 35;

/* ---------- utilitaires ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const $=id=>document.getElementById(id);
const LOGO='assets/logo.jpg';
const logoCard=(st='')=>`<div class="logo-card" style="${st}"><img src="${LOGO}" alt=""></div>`;
const OR='#F7830F',BL='#0B2B9A',DK='#061A5E';
const arrowSvg=(w=70,c='#fff')=>`<svg width="${w}" height="${w*0.5}" viewBox="0 0 100 50"><path d="M4 25 H80 M62 6 L88 25 L62 44" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const checkSvg=(s=40,c='#fff')=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><path d="M8 21 L17 30 L33 11" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const phoneIco=(s=60,c=OR)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path fill="${c}" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>`;

function head(lines,top,size){
  return `<div class="head" style="top:${top}px;font-size:${size}px">`+lines.map(([t,c])=>
    `<div class="ln"><span class="box ${c||''}">${t.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')}</span></div>`).join('')+`</div>`;
}
function animHead(el,lt,tin,tout=1e9){
  let wi=0;
  el.querySelectorAll('.box').forEach((b,j)=>{
    const d=tin+j*0.14, k=eOut(P(lt,d,d+0.28));
    b.style.transform=`skewX(-9deg) scaleX(${k})`;
    b.querySelectorAll('.w').forEach(w=>{
      const wd=d+0.1+wi*0.06; wi++;
      const kw=eBack(P(lt,wd,wd+0.32));
      w.style.opacity=P(lt,wd,wd+0.1);
      w.style.transform=`translateY(${(1-kw)*60}px) skewX(9deg)`;
    });
  });
  const o=eIn(P(lt,tout,tout+0.22));
  el.style.opacity=1-o;
  el.style.transform=`translateY(${-o*60}px) scale(${1+o*0.08})`;
}
function pop(el,lt,tin,tout=1e9,base=''){
  const k=eBack(P(lt,tin,tin+0.4)), o=eIn(P(lt,tout,tout+0.2));
  el.style.opacity=Math.min(P(lt,tin,tin+0.12),1-o);
  el.style.transform=`${base} scale(${Math.max(0,k)*(1-o*0.3)})`;
}

/* ---------- personnages (illustrations) ---------- */
function person(o){
  const skin=o.skin||'#7a4a2e', shade=o.shade||'#5b331c', hair=o.hair||'#17100c',
        shirt=o.shirt||OR, shirt2=o.shirt2||'rgba(0,0,0,.18)', mood=o.mood||'smile', st=o.style||'short', pose=o.pose||'phone';
  let vb='0 0 600 900', s='';
  if(pose==='showphone') vb='0 0 720 900';
  if(pose==='wave') vb='-140 0 740 900';
  if(st==='afro') s+=`<circle cx="300" cy="262" r="192" fill="${hair}"/>`;
  if(st==='bun') s+=`<circle cx="300" cy="118" r="74" fill="${hair}"/>`;
  if(st==='braids') s+=`<path d="M168 290 Q138 520 172 720 L248 720 Q214 520 226 320Z M432 290 Q462 520 428 720 L352 720 Q386 520 374 320Z" fill="${hair}"/>`;
  // corps
  s+=`<path d="M30 900 Q30 640 188 584 L300 602 L412 584 Q570 640 570 900Z" fill="${shirt}"/>`;
  s+=`<path d="M30 900 Q30 640 188 584 L210 600 Q90 660 96 900Z" fill="${shirt2}"/>`;
  s+=`<path d="M252 420 L348 420 L352 560 Q300 600 248 560Z" fill="${shade}"/>`;
  if(o.collar) s+=`<path d="M228 570 L300 650 L372 570 L346 556 L300 606 L254 556Z" fill="${o.collar}"/>`;
  else s+=`<path d="M246 566 Q300 616 354 566" fill="none" stroke="${shirt2}" stroke-width="16"/>`;
  if(pose==='bag') s+=`<path d="M200 588 L430 900" stroke="#4a2c17" stroke-width="30"/><path d="M200 588 L430 900" stroke="#6b4325" stroke-width="12"/>`;
  if(o.badge) s+=`<rect x="370" y="690" width="120" height="60" rx="10" fill="#fff"/><rect x="380" y="700" width="40" height="40" rx="6" fill="${OR}"/><rect x="428" y="706" width="52" height="10" rx="5" fill="${BL}"/><rect x="428" y="724" width="40" height="10" rx="5" fill="${BL}"/>`;
  // oreilles + tête
  s+=`<ellipse cx="172" cy="330" rx="25" ry="37" fill="${skin}"/><ellipse cx="428" cy="330" rx="25" ry="37" fill="${skin}"/>`;
  if(o.earrings) s+=`<circle cx="172" cy="382" r="14" fill="${OR}"/><circle cx="428" cy="382" r="14" fill="${OR}"/>`;
  s+=`<ellipse cx="300" cy="312" rx="131" ry="158" fill="${skin}"/>`;
  s+=`<ellipse cx="300" cy="420" rx="100" ry="44" fill="${shade}" opacity=".18"/>`;
  // cheveux devant
  if(st==='short') s+=`<path d="M170 300 Q158 146 300 140 Q442 146 430 300 Q418 222 300 210 Q182 222 170 300Z" fill="${hair}"/>`;
  if(st==='afro') s+=`<path d="M166 300 Q148 136 300 126 Q452 136 434 300 Q410 200 300 196 Q190 200 166 300Z" fill="${hair}"/>`;
  if(st==='bun'||st==='braids'){ s+=`<path d="M168 330 Q146 148 300 146 Q454 148 432 330 Q404 206 300 202 Q196 206 168 330Z" fill="${hair}"/>`;
    if(st==='braids') s+=`<path d="M220 170 Q205 230 196 300 M262 154 Q250 190 246 214 M338 154 Q350 190 354 214 M380 170 Q395 230 404 300" stroke="rgba(255,255,255,.12)" stroke-width="6" fill="none"/>`; }
  if(st==='wrap') s+=`<path d="M156 300 Q136 92 300 80 Q464 92 444 300 Q394 196 300 196 Q206 196 156 300Z" fill="${o.wrap}"/><path d="M176 236 Q300 168 424 236" stroke="${o.wrap2}" stroke-width="18" fill="none"/><path d="M196 172 Q300 120 404 172" stroke="${o.wrap2}" stroke-width="12" fill="none"/><ellipse cx="350" cy="92" rx="76" ry="48" fill="${o.wrap}"/><ellipse cx="350" cy="92" rx="34" ry="22" fill="${o.wrap2}"/>`;
  if(st==='cap') s+=`<path d="M170 300 Q158 160 300 150 Q442 160 430 300 Q418 230 300 222 Q182 230 170 300Z" fill="${hair}"/><path d="M164 238 Q166 108 300 102 Q434 108 436 238Z" fill="${o.cap}"/><path d="M164 236 Q300 206 436 236 L440 252 Q300 292 160 252Z" fill="${o.brim}"/><rect x="270" y="150" width="60" height="44" rx="8" fill="#fff"/><rect x="278" y="158" width="44" height="28" rx="5" fill="${OR}"/>`;
  if(o.phones) s+=`<path d="M160 330 Q150 120 300 116 Q450 120 440 330" fill="none" stroke="${o.phones}" stroke-width="24"/><rect x="138" y="290" width="54" height="96" rx="24" fill="${o.phones}"/><rect x="408" y="290" width="54" height="96" rx="24" fill="${o.phones}"/>`;
  // sourcils
  const br = mood==='think' ? ['M222 258 Q248 244 276 256','M324 248 Q352 230 380 246'] : ['M222 262 Q248 248 276 260','M324 260 Q352 248 378 262'];
  if(st!=='cap') s+=br.map(d=>`<path d="${d}" stroke="${hair}" stroke-width="10" fill="none" stroke-linecap="round"/>`).join('');
  // yeux
  const ey=o.down?316:302;
  if(mood==='big') s+=`<path d="M226 306 Q250 284 274 306 M326 306 Q350 284 374 306" stroke="#1a0e08" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  else s+=[250,350].map(x=>`<ellipse cx="${x}" cy="${ey}" rx="15" ry="18" fill="#1a0e08"/><circle cx="${x+5}" cy="${ey-6}" r="5" fill="#fff"/>`).join('');
  // nez
  s+=`<ellipse cx="300" cy="352" rx="22" ry="14" fill="${shade}" opacity=".45"/><path d="M282 362 Q300 374 318 362" fill="none" stroke="${shade}" stroke-width="7" stroke-linecap="round"/>`;
  // bouche
  if(mood==='big') s+=`<path d="M236 396 Q300 478 364 396 Q300 410 236 396Z" fill="#3b0f0f"/><path d="M246 399 Q300 412 354 399 L350 414 Q300 426 250 414Z" fill="#fff"/><path d="M270 448 Q300 460 330 448 Q300 440 270 448Z" fill="#c4505a"/>`;
  else if(mood==='think') s+=`<path d="M272 414 Q300 404 330 410" fill="none" stroke="#3b0f0f" stroke-width="8" stroke-linecap="round"/>`;
  else s+=`<path d="M252 400 Q300 440 348 400" fill="none" stroke="#3b0f0f" stroke-width="10" stroke-linecap="round"/>`;
  s+=`<ellipse cx="216" cy="372" rx="28" ry="15" fill="#ff7a5a" opacity=".2"/><ellipse cx="384" cy="372" rx="28" ry="15" fill="#ff7a5a" opacity=".2"/>`;
  // bras / pose
  if(pose==='phone'){
    s+=`<path d="M470 900 Q450 790 360 770 L330 840 Q400 850 400 900Z" fill="${shirt}"/><path d="M470 900 Q450 790 360 770 L352 790 Q430 810 440 900Z" fill="${shirt2}"/>`;
    s+=`<g transform="translate(232 612) rotate(-12)"><rect width="150" height="270" rx="24" fill="#1d1f2b"/><rect x="6" y="6" width="138" height="258" rx="20" fill="#2a2e3f"/><circle cx="34" cy="34" r="12" fill="#0d0f17"/><circle cx="34" cy="66" r="12" fill="#0d0f17"/>${o.glow?`<rect x="-30" y="-30" width="210" height="330" rx="40" fill="${o.glow}" opacity=".0"/>`:''}</g>`;
    s+=`<ellipse cx="330" cy="810" rx="70" ry="50" fill="${skin}"/><ellipse cx="262" cy="760" rx="20" ry="34" fill="${skin}" transform="rotate(-20 262 760)"/>`;
  }
  if(pose==='showphone'){
    s+=`<path d="M440 900 Q470 760 470 690 L560 690 Q570 790 545 900Z" fill="${shirt}"/>`;
    s+=`<g transform="translate(440 280) rotate(7)"><rect width="200" height="380" rx="30" fill="#1d1f2b"/><g transform="translate(10 12)">${o.screen||''}</g></g>`;
    s+=`<ellipse cx="520" cy="660" rx="62" ry="46" fill="${skin}"/><ellipse cx="452" cy="600" rx="18" ry="36" fill="${skin}" transform="rotate(20 452 600)"/>`;
  }
  if(pose==='wave'){
    s+=`<path d="M60 900 Q10 720 30 560 L110 560 Q100 720 170 900Z" fill="${shirt}"/>`;
    s+=`<g transform="rotate(${o.waveA||0} 70 540)"><ellipse cx="70" cy="500" rx="56" ry="66" fill="${skin}"/>${[0,1,2,3].map(i=>`<rect x="${26+i*24}" y="${400+(i===0||i===3?20:0)}" width="22" height="90" rx="11" fill="${skin}"/>`).join('')}<rect x="112" y="480" width="22" height="70" rx="11" fill="${skin}" transform="rotate(40 123 515)"/></g>`;
  }
  return `<svg viewBox="${vb}" width="100%" height="100%" preserveAspectRatio="xMidYMax meet">${s}</svg>`;
}
function qr(n=21,size=150,seed=7){
  let r=seed, cell=size/n, s='';
  const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  const finder=(x,y)=>`<rect x="${x*cell}" y="${y*cell}" width="${7*cell}" height="${7*cell}" fill="#0d1640"/><rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/><rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${3*cell}" height="${3*cell}" fill="#0d1640"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9))continue;
    if(rnd()>.52) s+=`<rect x="${x*cell}" y="${y*cell}" width="${cell+.3}" height="${cell+.3}" fill="#0d1640"/>`;
  }
  return `<rect width="${size}" height="${size}" fill="#fff"/>`+s+finder(0,0)+finder(n-7,0)+finder(0,n-7);
}
const ticketScreen = `<rect width="180" height="356" rx="22" fill="#fff"/><rect width="180" height="92" rx="22" fill="${BL}"/><rect y="60" width="180" height="32" fill="${BL}"/>
 <text x="90" y="40" text-anchor="middle" font-family="M" font-weight="900" font-style="italic" font-size="17" fill="#fff">SOUMAHORO</text>
 <text x="90" y="64" text-anchor="middle" font-family="M" font-weight="900" font-style="italic" font-size="17" fill="${OR}">TRANSPORT</text>

function hillPath(base,a1,a2,ph,bottom=1920){
  let d=`M0 ${bottom} `;
  for(let x=0;x<=2160;x+=20){const y=base+a1*Math.sin((x/540)*2*Math.PI+ph)+a2*Math.sin((x/360)*2*Math.PI+ph*2);d+=`L${x} ${y.toFixed(1)} `;}
  return d+`L2160 ${bottom}Z`;
}
function tree(x,y,s,c1,c2,kind){
  if(kind==='palm') return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-6 0 Q-14 -120 8 -230 L18 -228 Q2 -120 8 0Z" fill="${c2}"/>${[-70,-30,10,50,90,140].map(a=>`<path d="M10 -228 Q${10+Math.cos(a*Math.PI/180)*90} ${-268+Math.sin(a*Math.PI/180)*30} ${10+Math.cos(a*Math.PI/180)*150} ${-200+Math.sin(a*Math.PI/180)*70} Q${10+Math.cos(a*Math.PI/180)*80} ${-238} 10 -222Z" fill="${c1}"/>`).join('')}</g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="-90" width="18" height="90" fill="${c2}"/><circle cx="0" cy="-130" r="70" fill="${c1}"/><circle cx="-40" cy="-100" r="46" fill="${c1}"/><circle cx="42" cy="-104" r="48" fill="${c1}"/></g>`;
}

/* ---------- transitions + rendu ---------- */
const CUTS=[[3,'wipe'],[7,'flash'],[11,'wipe'],[15,'wipe'],[16.8,'flash'],[18.4,'flash'],[20,'wipe'],[24,'wipe'],[25,'flash'],[26,'flash'],[27.5,'flash'],[29,'wipe']];
function render(t){
  for(const sc of S){const on=t>=sc.s&&t<sc.e||(sc.e===DUREE&&t>=sc.s); sc.el.style.display=on?'block':'none'; if(on) sc.update(sc,t-sc.s);}
  const br=$('brand'), bo=P(t,3.05,3.4)*(1-P(t,28.7,29));
  br.style.opacity=bo; br.style.transform=`translateX(${(1-eOut(P(t,3.05,3.4)))*-60}px)`;
  br.querySelector('.pill').style.transform=`scale(${1+Math.max(0,Math.sin(t*Math.PI))*0.04})`;
  const bars=$('wipe').children; let wv=null, fl=0;
  for(const [c,k] of CUTS){ if(k==='wipe'&&t>c-0.3&&t<c+0.3) wv=(t-(c-0.3))/0.6; if(k==='flash') fl=Math.max(fl,1-Math.abs(t-c)/0.12); }
  for(let i=0;i<2;i++){const b=bars[i]; if(wv===null){b.style.display='none';continue;}
    const q=eIO(clamp(wv+(i?-0.0:0.06)*(i?1:-1))); b.style.display='block'; b.style.left=lerp(1400,-2100,clamp(q))+(i?0:-160)+'px';}
  $('flash').style.opacity=clamp(fl)*0.85;
}
window.render=render;
window.ready=Promise.all([document.fonts.load('900 italic 40px M'),document.fonts.load('800 40px M'),...[...document.images].map(i=>i.decode().catch(()=>{}))]).then(()=>document.fonts.ready);

const qs=new URLSearchParams(location.search);
if(qs.has('render')){document.body.className='render';}
else if(qs.has('t')){render(parseFloat(qs.get('t')));}
else{ // aperçu dans le navigateur
  const st=$('stage'); const fit=()=>{const s=Math.min(innerWidth/1080,innerHeight/1920);st.style.transform=`scale(${s})`;document.body.style.height=1920*s+'px';};
  fit(); addEventListener('resize',fit);
  const t0=performance.now(); const loop=()=>{render(((performance.now()-t0)/1000)%DUREE);requestAnimationFrame(loop);}; window.ready.then(loop);
}
